[project]
name = "lab0"
version = "0.1.0"
description = "Data preprocessing library and Click CLI for MLOps Lab 0"
readme = "README.md"

requires-python = ">=3.11"
dependencies = [
    "black>=26.10.1",
    "click>=8.5.1",
    "pylint>=4.1.3",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]

[project.scripts]
lab0 = "src.cli:cli"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "src"
module-root = ""
